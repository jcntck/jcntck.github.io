name: Prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to redeploy (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Production validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Resolve release source
        id: source
        env:
          EVENT: ${{ github.event_name }}
          RECOVERY_TAG: ${{ inputs.release_tag }}
          PUSH_COMMIT: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ ! "$RECOVERY_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Informe uma tag de release SemVer existente."
              exit 1
            fi
            echo "ref=refs/tags/$RECOVERY_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$PUSH_COMMIT" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Identify validated release
        id: release
        env:
          EVENT: ${{ github.event_name }}
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { readRelease } from './scripts/release.mjs'
          const { version, tag } = readRelease()
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          if (process.env.EVENT === 'workflow_dispatch' && tag !== process.env.RECOVERY_TAG) throw new Error('A tag solicitada diverge da versão do pacote.')
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ncommit=${commit}\n`)
          NODE
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Browser test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-validation-report
          path: playwright-report/
          retention-days: 7

  tag:
    name: Release tag
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Reject obsolete automatic release
        if: github.event_name == 'push'
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::main avançou; esta execução não pode substituir uma entrega mais recente."
            exit 1
          fi
      - run: node scripts/tag-release.mjs

  deploy:
    name: Deploy and verify Pages
    needs: [validate, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Reject obsolete automatic deployment
        if: github.event_name == 'push'
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          latest=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
          if [[ "$latest" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::main avançou; esta execução está obsoleta."
            exit 1
          fi
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify live desktop and mobile site
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: npm run test:browser
      - name: Record delivery evidence
        if: always()
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_URL: ${{ steps.deployment.outputs.page_url }}
          DELIVERY_RESULT: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, appendFileSync } from 'node:fs'
          const evidence = {
            version: process.env.RELEASE_VERSION,
            tag: `v${process.env.RELEASE_VERSION}`,
            commit: process.env.RELEASE_COMMIT,
            url: process.env.RELEASE_URL || null,
            run: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            result: process.env.DELIVERY_RESULT,
            verification: 'Playwright: desktop e celular emulado',
            homologation: 'Pendente de decisão explícita do usuário',
          }
          writeFileSync('release-evidence.json', JSON.stringify(evidence, null, 2) + '\n')
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Evidências da entrega\n\n```json\n' + JSON.stringify(evidence, null, 2) + '\n```\n')
          NODE
      - name: Delivery evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-evidence
          path: |
            release-evidence.json
            playwright-report/
          retention-days: 30
